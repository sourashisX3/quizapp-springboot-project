spring.application.name=quizapp
server.port=8083

# MySQL Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/quizapp_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sourashis
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (disabled for now — using JPA ddl-auto)
spring.flyway.enabled=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT Configuration
jwt.secret=your-256-bit-secret-key-must-be-at-least-32-chars-long-replace-this-value-in-production-environment
jwt.access-token-expiry-ms=36000000
jwt.refresh-token-expiry-ms=604800000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# Logging
logging.level.com.sourashis.quizapp=INFO
logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

